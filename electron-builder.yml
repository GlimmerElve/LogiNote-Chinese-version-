appId: com.loginote.pro
productName: LogiNote
artifactName: "${productName}-Setup-${version}.${ext}"
directories:
  output: release
files:
  - "dist-electron/**/*"
  - "dist/**/*"
  - "package.json"
extraResources:
  - from: "models/"
    to: "models/"
  - from: "release/stt_dist/stt_server/"
    to: "stt_server/"
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: GlimmerElve
  repo: LogiNote-Chinese-version-
